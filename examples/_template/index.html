<!DOCTYPE html>
<!--
  PLANTILLA DE PÁGINA DE EJEMPLO (no se compila ni aparece en el índice: las carpetas que empiezan por "_" se ignoran).
  Para crear el ejemplo de un componente:
    1. Copia esta carpeta a examples/{slug}/ (slug en kebab-case, igual que en vainilla: button, text-field...).
    2. En index.html y main.tsx sustituye __SLUG__ por el slug y __TITLE__ por el nombre visible en inglés (p. ej. "Text Field").
    3. Crea las demos en demos/{slug}/NN-name.tsx (01-basic.tsx, 02-variants.tsx...), cada una con
       `export default function Demo()` y `export const title = { en: '...', es: '...' }`.
  Ver examples/_template/main.tsx para el detalle.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__TITLE__ · Materix UI React</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234818d0'/%3E%3Cpath d='M8 23V9h3l5 7 5-7h3v14h-3v-9l-5 7-5-7v9z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
