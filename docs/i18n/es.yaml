home_feature_3_desc: "Forma de 4px, Roboto, paleta, sombras y estados de interacción de MUI y Material Design 2."
home_feature_4_title: "Accesible por defecto"
home_feature_4_desc: "Semántica nativa, navegación con teclado, foco visible y ARIA gestionado por cada componente."
home_feature_5_title: "Tema claro y oscuro"
home_feature_5_desc: "Design tokens <code>--mtx-*</code> centralizados: cambia todo el tema con un atributo."
home_feature_6_title: "API programática"
home_feature_6_desc: "Cuando lo necesites: <code>new Materix.Dialog(el)</code>, <code>Materix.initAll(container)</code> o <code>Materix.watch()</code>."
