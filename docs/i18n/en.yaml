home_feature_1_title: "No frameworks"
home_feature_1_desc: "Vanilla CSS and JavaScript. Works in static HTML, PHP, Django, Rails, Laravel or inside any SPA."
home_feature_2_title: "One element"
home_feature_2_desc: "Write <code>&lt;input data-mtx=\"text-field\"&gt;</code> and the library builds the label, outline and icons for you."
home_feature_3_title: "Faithful to Material UI"
home_feature_3_desc: "4px shape, Roboto, MUI palette, shadows and interaction states from Material Design 2."
home_feature_4_title: "Accessible by default"
home_feature_4_desc: "Native semantics, keyboard navigation, visible focus and ARIA managed by each component."
home_feature_5_title: "Light and dark themes"
home_feature_5_desc: "Centralized <code>--mtx-*</code> design tokens: switch the whole theme with one attribute."
home_feature_6_title: "Programmatic API"
home_feature_6_desc: "When you need it: <code>new Materix.Dialog(el)</code>, <code>Materix.initAll(container)</code> or <code>Materix.watch()</code>."
